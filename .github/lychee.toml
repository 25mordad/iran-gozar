# Link checker configuration (https://lychee.cli.rs). Used by .github/workflows/pr-check.yml.
# Internal links are also checked by `mkdocs build --strict`; this mainly checks external links.

cache = true
max_cache_age = "2d"
max_retries = 3
retry_wait_time = 5
timeout = 30
no_progress = true

# Many sites block automated checkers with 403 or rate-limit with 429; those are not broken links.
accept = ["200..=299", "403", "429"]

# docs/downloads*.md link to files that only exist in the deployed site (PDFs, ZIP).
exclude_path = ["site", "node_modules", ".venv", "docs/project", "templates", "docs/downloads.md", "docs/downloads.en.md"]

exclude = [
  # Links that only exist after the site is deployed or that need a login.
  '^https://25mordad\.github\.io/iran-gozar',
  # This repository itself: links into it are checked by `mkdocs build --strict`, and it may
  # still be private or have no main branch when a PR is opened.
  '^https://github\.com/25mordad/iran-gozar',
  '^https?://(127\.0\.0\.1|localhost)',
  # Pages generated at build time from the root files (hooks/root_docs.py); checked by mkdocs --strict.
  'docs/project/',
  '^mailto:',
  '^https://t\.me/share',
  '^https://wa\.me/',
  '^https://x\.com/intent',
]
