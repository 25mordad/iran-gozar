# Link checker configuration (https://lychee.cli.rs). Used by .github/workflows/pr-check.yml.
# Internal links are also checked by `mkdocs build --strict`; this mainly checks external links.

cache = true
max_cache_age = "2d"
max_retries = 3
retry_wait_time = 5
timeout = 30
no_progress = true
include_fragments = false

# Many sites block automated checkers with 403 or rate-limit with 429; those are not broken links.
accept = ["200..=299", "403", "429"]

exclude_path = ["site", "node_modules", ".venv", "docs/project", "templates"]

exclude = [
  # Links that only exist after the site is deployed or that need a login.
  '^https://25mordad\.github\.io/iran-gozar',
  '^https://github\.com/25mordad/iran-gozar/(edit|issues/new|compare|fork)',
  '^https://github\.com/25mordad/iran-gozar/blob/main/',
  '^https://github\.com/25mordad/iran-gozar/tree/main/',
  '^https?://(127\.0\.0\.1|localhost)',
  '^mailto:',
  '^https://t\.me/share',
  '^https://wa\.me/',
  '^https://x\.com/intent',
]
