# Builds the website (with PDF files and an offline copy) and publishes it to GitHub Pages
# on every push to main. One-time setup: Settings → Pages → Source: "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-pdf.txt

      - name: Build site
        run: mkdocs build --strict

      - name: Install browser for PDF generation
        run: python -m playwright install --with-deps chromium

      - name: Build PDF files
        # The site is still published if PDF generation fails; the log shows why.
        continue-on-error: true
        run: python scripts/build_pdfs.py --site site --out site/pdf

      - name: Build offline copy (zip)
        continue-on-error: true
        run: |
          GOZAR_OFFLINE=true mkdocs build --site-dir offline-site
          (cd offline-site && zip -qr ../site/gozar-offline.zip .)

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
