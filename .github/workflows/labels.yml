# Creates and updates the repository's labels from .github/labels.yml.
# Runs when that file changes on main, or manually from the Actions tab.
name: Sync labels

on:
  push:
    branches: [main]
    paths: [.github/labels.yml]
  workflow_dispatch:

permissions:
  issues: write

jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crazy-max/ghaction-github-labeler@v5
        with:
          yaml-file: .github/labels.yml
          # Keep GitHub's default labels (bug, enhancement, …) instead of deleting them.
          skip-delete: true
