# Runs on every pull request: checks document format, builds the site in strict mode
# (which fails on broken internal links and anchors) and checks external links.
name: Check pull request

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Documents and site build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check document format (plain summary, front matter, orthography)
        run: python scripts/check_docs.py

      - name: Build site (strict — fails on broken links or anchors)
        run: mkdocs build --strict

  links:
    name: External links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore link-check cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: lychee-${{ github.sha }}
          restore-keys: lychee-

      - name: Check links in Markdown files
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          args: >-
            --config .github/lychee.toml
            './**/*.md'
