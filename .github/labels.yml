# Label definitions for the repository. Synced to GitHub by .github/workflows/labels.yml.
# Names are Persian (the project's main language); descriptions are bilingual.
# To add or change a label, edit this file and open a PR.

- name: "مبتدی-پسند"
  color: "7057ff"
